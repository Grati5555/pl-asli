name: Update PLmytoko2 Automatically

on:
  workflow_dispatch: # Memungkinkan tombol 'Run workflow' manual di tab Actions
  schedule:
    - cron: '0 */6 * * *' # Otomatis update setiap 6 jam sekali

jobs:
  update-playlist:
  
    runs-on: ubuntu-latest
    
    permissions:
      contents: write # Izin agar bot bisa melakukan commit file hasil update ke repo

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Run Script to Update Playlist
      run: python mytokoFull.py

    - name: Commit and Push Changes if Playlist Updated
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add PLmytoko2.m3u
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update PLmytoko2.m3u [skip ci]" && git push)
