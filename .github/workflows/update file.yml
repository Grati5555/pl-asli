name: Update Pl Semar Asli

on:
  workflow_dispatch: # Tombol manual untuk menjalankan skrip di tab Actions
  schedule:
    - cron: '0 0 * * *' # Otomatis update setiap hari jam 12 malam (opsional)

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Download Script
        run: python "download file.py"

      - name: Commit and Push if changed
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add plsemarasli.m3u
          git commit -m "Auto-update plsemarasli.m3u" || exit 0
          git push
