name: Auto Update Plkoko

on:
  schedule:
    # Otomatis update setiap 1 jam sekali
    - cron: '0 * * * *'
  workflow_dispatch: # Tombol "Run workflow" manual di tab Actions GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Update Script
        run: python KokoUyo.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Plkoko.m3u
          git diff --staged --quiet || git commit -m "Auto-update Plkoko.m3u [skip ci]"
          git push
